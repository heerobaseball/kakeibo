<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふたりの家計簿 | AI家計管理アプリ</title>
    <meta name="description" content="AIがレシートを自動解析。夫婦の支出を賢く管理するスマート家計簿アプリ。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --bg2: #1e293b;
            --surface: rgba(255,255,255,0.05);
            --surface-hover: rgba(255,255,255,0.09);
            --border: rgba(255,255,255,0.1);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent1: #6366f1;
            --accent2: #06b6d4;
            --grad: linear-gradient(135deg, #6366f1, #06b6d4);
            --grad-soft: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(6,182,212,0.15));
            --success: #10b981;
            --danger: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ====== HEADER ====== */
        .app-header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 40%, #06b6d4 100%);
            padding: 20px 20px 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .app-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .app-header h1 {
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #fff;
            position: relative;
        }
        .app-header .subtitle {
            font-size: 0.78em;
            color: rgba(255,255,255,0.75);
            margin-top: 4px;
            font-weight: 300;
            position: relative;
        }
        .header-nav {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .nav-link {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 8px 14px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.8em;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .nav-link:hover { background: rgba(255,255,255,0.25); }

        /* ====== MAIN CARD ====== */
        .main-container { max-width: 520px; margin: -40px auto 0; padding: 0 16px; }

        .card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        /* ====== TABS ====== */
        .tab-group {
            display: flex;
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 24px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'Noto Sans JP', sans-serif;
        }
        .tab-btn.active {
            background: var(--grad);
            color: #fff;
            box-shadow: 0 4px 15px rgba(99,102,241,0.35);
        }
        .tab-btn:not(.active):hover { background: var(--surface-hover); color: var(--text); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ====== DROP ZONE ====== */
        #dropZone {
            border: 2px dashed rgba(99,102,241,0.4);
            border-radius: var(--radius);
            padding: 28px 20px;
            text-align: center;
            background: var(--grad-soft);
            margin-bottom: 20px;
            transition: all 0.25s;
            cursor: pointer;
        }
        #dropZone.dragover {
            border-color: var(--accent1);
            background: rgba(99,102,241,0.2);
            transform: scale(1.01);
        }
        .dropzone-icon { font-size: 2.4em; margin-bottom: 8px; }
        .dropzone-title { font-size: 0.95em; font-weight: 500; margin-bottom: 4px; }
        .dropzone-sub { font-size: 0.75em; color: var(--text-muted); margin-bottom: 16px; }

        .action-buttons { display: flex; gap: 10px; }
        .btn-camera, .btn-gallery {
            flex: 1;
            padding: 11px 8px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans JP', sans-serif;
        }
        .btn-camera {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }
        .btn-gallery {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }
        .btn-camera:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-gallery:hover { filter: brightness(1.1); transform: translateY(-1px); }

        #fileName {
            margin-top: 14px;
            font-size: 0.82em;
            font-weight: 500;
            color: var(--accent2);
            min-height: 20px;
        }

        /* ====== FORM ELEMENTS ====== */
        label {
            display: block;
            font-size: 0.78em;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.03em;
        }
        textarea, input[type="text"], input[type="date"], input[type="number"], select {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 12px 14px;
            font-size: 0.9em;
            font-family: 'Noto Sans JP', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 16px;
            resize: vertical;
        }
        textarea:focus, input:focus, select:focus {
            border-color: var(--accent1);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
        }
        select option { background: var(--bg2); }

        /* ====== SUBMIT BUTTON ====== */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--grad);
            color: #fff;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'Noto Sans JP', sans-serif;
            box-shadow: 0 6px 20px rgba(99,102,241,0.4);
            letter-spacing: 0.03em;
        }
        .btn-submit:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(99,102,241,0.5); }
        .btn-submit:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }

        /* ====== RESULT ITEMS ====== */
        #resultArea { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .result-item {
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            font-size: 0.85em;
            line-height: 1.7;
            transition: all 0.3s;
            animation: fadeIn 0.3s ease;
        }
        .result-item.success { border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.08); }
        .result-item.error   { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.08); }
        .result-success { color: var(--success); font-weight: 600; }
        .result-error   { color: var(--danger); font-weight: 500; }

        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        /* ====== SPINNER ====== */
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(99,102,241,0.3);
            border-top-color: var(--accent1);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ====== FOOTER ====== */
        .page-footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.72em;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header class="app-header">
        <nav class="header-nav">
            <a href="/summary.html" class="nav-link">📊 集計・履歴</a>
        </nav>
        <h1>💳 ふたりの家計簿</h1>
        <p class="subtitle">AI があなたのレシートを自動解析します</p>
    </header>

    <main class="main-container">
        <div class="card">
            <!-- タブ切替 -->
            <div class="tab-group" role="tablist">
                <button id="tabImage" class="tab-btn active" role="tab" aria-selected="true">📷 レシート画像</button>
                <button id="tabText"  class="tab-btn"        role="tab" aria-selected="false">✍️ テキスト入力</button>
            </div>

            <!-- 画像タブ -->
            <form id="uploadForm" class="tab-content active">
                <div id="dropZone" role="button" aria-label="画像をドロップ">
                    <div class="dropzone-icon">🧾</div>
                    <p class="dropzone-title">レシートを追加</p>
                    <p class="dropzone-sub">PCの場合はここにドラッグ＆ドロップも可</p>
                    <div class="action-buttons">
                        <button type="button" class="btn-camera" id="btnCamera">📷 カメラで撮る</button>
                        <button type="button" class="btn-gallery" id="btnGallery">🖼️ フォルダから選ぶ</button>
                    </div>
                    <div id="fileName"></div>
                </div>

                <input type="file" id="cameraInput"  accept="image/*" capture="environment" style="display:none;">
                <input type="file" id="galleryInput" accept="image/*" multiple            style="display:none;">

                <label for="commentInputImage">共通コメント（支払った人・負担割合など）</label>
                <textarea id="commentInputImage" rows="3" placeholder="例: 妻が支払い。食費は折半、化粧品は妻負担。"></textarea>

                <button type="submit" id="submitBtn" class="btn-submit">✨ AIで一括解析して登録</button>
            </form>

            <!-- テキストタブ -->
            <form id="textForm" class="tab-content">
                <label for="textInput">支出の内容を自由に入力してください</label>
                <textarea id="textInput" rows="5" placeholder="例: 昨日スーパーで食料品を 3,000円 夫が支払い。全額夫負担。"></textarea>
                <button type="submit" class="btn-submit">✨ AIで解析して登録</button>
            </form>

            <div id="resultArea"></div>
        </div>

        <p class="page-footer">© ふたりの家計簿 — Powered by Cloudflare Workers &amp; Gemini AI</p>
    </main>

    <script>
        // -------- Tab --------
        const tabs = [
            { btn: 'tabImage', form: 'uploadForm' },
            { btn: 'tabText',  form: 'textForm'   }
        ];
        tabs.forEach(({ btn, form }) => {
            document.getElementById(btn).addEventListener('click', () => {
                tabs.forEach(t => {
                    document.getElementById(t.btn).classList.toggle('active', t.btn === btn);
                    document.getElementById(t.form).classList.toggle('active', t.form === form);
                });
            });
        });

        // -------- File handling --------
        const dropZone        = document.getElementById('dropZone');
        const cameraInput     = document.getElementById('cameraInput');
        const galleryInput    = document.getElementById('galleryInput');
        const fileNameDisplay = document.getElementById('fileName');
        let currentSelectedFiles = [];

        document.getElementById('btnCamera').addEventListener('click', () => cameraInput.click());
        document.getElementById('btnGallery').addEventListener('click', () => galleryInput.click());

        function updateFileDisplay(files) {
            currentSelectedFiles = files;
            if (!files.length) { fileNameDisplay.textContent = ''; return; }
            fileNameDisplay.textContent = files.length === 1
                ? `✅ 選択中: ${files[0].name}`
                : `✅ ${files.length}枚のレシート画像を選択中`;
        }

        cameraInput.addEventListener('change', () => { if (cameraInput.files.length)  { galleryInput.value = ''; updateFileDisplay(cameraInput.files); } });
        galleryInput.addEventListener('change', () => { if (galleryInput.files.length) { cameraInput.value  = ''; updateFileDisplay(galleryInput.files); } });

        dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) { galleryInput.files = e.dataTransfer.files; cameraInput.value = ''; updateFileDisplay(galleryInput.files); }
        });

        // -------- Helper delay & image compression --------
        const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

        function compressImage(file, maxSide = 1200, quality = 0.75) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    let w = img.width, h = img.height;
                    if (w > maxSide || h > maxSide) {
                        if (w > h) { h = Math.round((h * maxSide) / w); w = maxSide; }
                        else       { w = Math.round((w * maxSide) / h); h = maxSide; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    canvas.toBlob(blob => {
                        const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: 'image/jpeg' });
                        const reader = new FileReader();
                        reader.onloadend = () => resolve({ compressedFile, base64: reader.result.split(',')[1] });
                        reader.readAsDataURL(blob);
                    }, 'image/jpeg', quality);
                };
                img.onerror = () => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve({ compressedFile: file, base64: reader.result.split(',')[1] });
                    reader.readAsDataURL(file);
                };
                img.src = url;
            });
        }

        // -------- AI Prompt --------
        const todayStr  = new Date().toLocaleDateString('ja-JP');
        const basePrompt = `本日は ${todayStr} です。以下の情報を解析し、指定されたJSONフォーマットで出力してください。JSON以外のテキストは絶対に含めないでください。
ルール:
1. "date" は、レシートに印字されている日付、または入力内容から推測される決済日を "YYYY-MM-DD" 形式で出力。
2. "payer" (支払った人) は必ず "夫" または "妻" のいずれかに統一。
3. "genre" (ジャンル) は以下の4つの中から最も適したものを選んでください: ["食料品、日用品", "外食費", "旅費", "その他"]
フォーマット:
{ "date": "YYYY-MM-DD", "description": "購入した主な品目や店舗名", "total_amount": 合計金額(数値), "payer": "夫 または 妻", "husband_burden": 夫の負担額(数値), "wife_burden": 妻の負担額(数値), "genre": "選んだジャンル" }`;

        // -------- processAI --------
        async function processAI(contentsArray, statusDiv, originalFile = null) {
            const label = originalFile ? originalFile.name : 'テキスト入力';
            try {
                statusDiv.innerHTML = `<span class="spinner"></span><strong>${label}</strong> — AI解析の準備中...`;

                const configRes  = await fetch('/api/config');
                const configText = await configRes.text();
                let configData;
                try { configData = JSON.parse(configText); }
                catch { throw new Error(`/api/config から予期せぬ応答: ${configText.substring(0, 80)}`); }
                if (!configData.apiKey) throw new Error('GEMINI_API_KEY が未設定です。Cloudflare 環境変数をご確認ください。');

                const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${configData.apiKey}`;
                
                // --- Retry loop for 429 Rate Limit ---
                let geminiData = null;
                let maxRetries = 5;
                for (let attempt = 1; attempt <= maxRetries; attempt++) {
                    statusDiv.innerHTML = `<span class="spinner"></span><strong>${label}</strong> — Gemini AI が解析中...${attempt > 1 ? ` (再試行 ${attempt-1}/${maxRetries-1})` : ''}`;

                    const geminiRes  = await fetch(geminiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: contentsArray }] }) });
                    const geminiText = await geminiRes.text();
                    try { geminiData = JSON.parse(geminiText); }
                    catch { throw new Error(`Gemini API から予期せぬ応答: ${geminiText.substring(0, 80)}`); }

                    if (geminiRes.ok) {
                        break;
                    }

                    if (geminiRes.status === 429 || geminiData.error?.code === 429) {
                        if (attempt < maxRetries) {
                            const waitSec = attempt * 6; // 6s, 12s, 18s, 24s...
                            statusDiv.innerHTML = `<span class="spinner"></span><strong>${label}</strong> — ⏳ 無料枠制限回避のため ${waitSec}秒待機して自動再試行します...`;
                            await delay(waitSec * 1000);
                            continue;
                        }
                        throw new Error('Google Gemini APIの無料枠制限（1分間あたりのリクエスト上限）に達しました。約1分後に再試行するか、Google AI StudioでPay-as-you-go設定をご検討ください。');
                    } else {
                        throw new Error(`Google API エラー: ${geminiData.error?.message || '詳細不明'}`);
                    }
                }

                const rawText       = geminiData.candidates?.[0]?.content?.parts?.[0]?.text || '';
                const cleanedJson   = rawText.replace(/```json\s*|```/g, '').trim();
                let parsedData;
                try { parsedData = JSON.parse(cleanedJson); }
                catch { throw new Error(`JSON パース失敗: ${rawText.substring(0, 80)}`); }

                statusDiv.innerHTML = `<span class="spinner"></span><strong>${label}</strong> — データを保存中...`;

                const formData = new FormData();
                formData.append('data', JSON.stringify(parsedData));
                if (originalFile) formData.append('image', originalFile);

                const saveRes  = await fetch('/api/upload', { method: 'POST', body: formData });
                const saveText = await saveRes.text();
                let saveData;
                try { saveData = JSON.parse(saveText); }
                catch { throw new Error(`保存エラー: ${saveText.substring(0, 120)}`); }

                if (saveData.success) {
                    statusDiv.classList.add('success');
                    statusDiv.innerHTML = `<span class="result-success">✅ 登録完了</span><br><strong>${label}</strong><br>📅 ${saveData.data.date} &nbsp;|&nbsp; 🏷️ ${saveData.data.genre} &nbsp;|&nbsp; 📝 ${saveData.data.description}<br>合計金額: <strong>${Number(saveData.data.total_amount).toLocaleString()}円</strong>`;
                } else {
                    throw new Error(saveData.error);
                }
            } catch (err) {
                console.error('AI Process Error:', err);
                statusDiv.classList.add('error');
                statusDiv.innerHTML = `<span class="result-error">❌ エラー</span><br><strong>${label}</strong><br>${err.message}`;
            }
        }

        // -------- Upload Form Submit --------
        document.getElementById('uploadForm').addEventListener('submit', async e => {
            e.preventDefault();
            const files = currentSelectedFiles;
            if (!files.length)   { alert('カメラで撮影するか、画像を選択してください'); return; }
            if (files.length > 5){ alert('一度に処理できるのは最大5枚です。'); return; }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 処理中...';

            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '';
            const comment = document.getElementById('commentInputImage').value;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (i > 0) {
                    await delay(3000); // 3秒間隔
                }

                const statusDiv = document.createElement('div');
                statusDiv.className = 'result-item';
                statusDiv.innerHTML = `<strong>${file.name}</strong> — 🎨 画像最適化 &amp; 解析中...`;
                resultArea.appendChild(statusDiv);

                // 画像の自動軽量化・圧縮 (解像度制限&JPEG化でAPIトークン消費量を劇的に削減)
                const { compressedFile, base64 } = await compressImage(file, 1200, 0.75);

                const prompt = basePrompt + `\n\n【ユーザー共通コメント】: "${comment}"\n【画像】: 添付のレシート`;
                await processAI([{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: base64 } }], statusDiv, compressedFile);
            }

            document.getElementById('uploadForm').reset();
            currentSelectedFiles = [];
            fileNameDisplay.textContent = '✅ 全ての処理が完了しました！';
            submitBtn.disabled = false;
            submitBtn.textContent = '✨ AIで一括解析して登録';
        });

        // -------- Text Form Submit --------
        document.getElementById('textForm').addEventListener('submit', async e => {
            e.preventDefault();
            const text = document.getElementById('textInput').value;
            if (!text) { alert('支出の内容を入力してください'); return; }

            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '';
            const statusDiv = document.createElement('div');
            statusDiv.className = 'result-item';
            resultArea.appendChild(statusDiv);

            await processAI([{ text: basePrompt + `\n\n【入力内容】: "${text}"` }], statusDiv);
            document.getElementById('textForm').reset();
        });
    </script>
</body>
</html>
